name: soc-analyst-triage

services:
  nginx:
    image: nginx:alpine
    container_name: soc-analyst-triage
    expose:
      - "80"
    networks:
      - traefik-proxy
      - default
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.soc.rule=Host(`soc.porosec.fi`)
      - traefik.http.routers.soc.entrypoints=websecure
      - traefik.http.routers.soc.tls.certresolver=letsencrypt
      - traefik.http.routers.soc.middlewares=security-headers@file
      - traefik.http.services.soc.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build: ./server
    container_name: soc-analyst-triage-api
    volumes:
      - scores-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  traefik-proxy:
    external: true

volumes:
  scores-data:
